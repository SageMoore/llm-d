apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
# SGLang-parity topology: 1 prefill worker (DEP8) + 2 decode workers (DEP16 each)
# -> 1x8 + 2x16 = 40 GPUs / 10 nodes total.
# Prefill worker: TP=1, DP=8,  EP=8  (DEP8,  2 nodes).
# Decode  worker: TP=1, DP=16, EP=16 (DEP16, 4 nodes); 2 replicas (32 decode GPUs, EP16 each).
patches:
  - target:
      kind: LeaderWorkerSet
      name: ".*-prefill"
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: LeaderWorkerSet
      name: ".*-decode"
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
      - op: replace
        path: /spec/leaderWorkerTemplate/size
        value: 4
