apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
# SGLang-parity topology: 4 prefill workers (DEP8) + 1 decode worker (DEP16)
# -> 4x8 + 1x16 = 48 GPUs / 12 nodes total.
# Prefill worker: TP=1, DP=8,  EP=8  (DEP8,  2 nodes).
# Decode  worker: TP=1, DP=16, EP=16 (DEP16, 4 nodes).
patches:
  - target:
      kind: LeaderWorkerSet
      name: ".*-prefill"
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 4
  - target:
      kind: LeaderWorkerSet
      name: ".*-decode"
    patch: |-
      - op: replace
        path: /spec/leaderWorkerTemplate/size
        value: 4
